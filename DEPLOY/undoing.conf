# =============================================================================
# UndoinG — nginx do VPS (Hostinger)
# Arquivo de destino no servidor: /etc/nginx/sites-available/undoing
#
# REESCRITO EM 06/09/2026. O que mudou e por quê:
#
#  1. CABEÇALHOS DE SEGURANÇA. Eles existiam só no netlify.toml — que não vale
#     mais nada, porque a Netlify saiu do caminho. Na prática a produção estava
#     SEM HSTS, SEM Content-Security-Policy, SEM Permissions-Policy. Agora estão
#     aqui, que é onde o site é realmente servido.
#  2. /api/ virou o caminho oficial das funções. O runtime (deploy/server.mjs)
#     já aceita os dois formatos, então /.netlify/functions/ segue funcionando
#     como atalho antigo — nada quebra durante a transição.
#  3. /assets/ devolve 404 de verdade quando o arquivo não existe, em vez de cair
#     no index.html (era isso que gerava erro de MIME type no navegador depois
#     de cada deploy novo).
#  4. index.html, sw.js, manifest e workbox nunca mais ficam em cache.
#  5. Os dois domínios respondem: udgservidor.online e undoing.com.br.
#
# DEPOIS DE COPIAR:
#     nginx -t && systemctl reload nginx
#
# Se undoing.com.br ainda não tem certificado neste servidor:
#     certbot --nginx -d undoing.com.br -d www.undoing.com.br
# =============================================================================

# ---------------------------------------------------------------------------
# Redirecionamento de HTTP para HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name udgservidor.online www.udgservidor.online undoing.com.br www.undoing.com.br 187.127.51.179;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# Site
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name udgservidor.online www.udgservidor.online undoing.com.br www.undoing.com.br;

    root /opt/undoing/dist;
    index index.html;

    client_max_body_size 100m;

    # -----------------------------------------------------------------------
    # Cabeçalhos de segurança (aplicados a tudo, inclusive respostas de erro)
    # -----------------------------------------------------------------------
    add_header X-Frame-Options            "DENY" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header X-XSS-Protection           "1; mode=block" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy         "camera=(self), geolocation=(self), microphone=(self), payment=(), interest-cohort=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # NOTA sobre 'unsafe-inline'/'unsafe-eval': ainda são necessários por causa
    # do ffmpeg.wasm e do mediapipe. O próximo passo de endurecimento é migrar
    # para nonce + 'wasm-unsafe-eval' (descrito em SEGURANCA_PQ.md).
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: blob:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; media-src 'self' blob: https: data:; connect-src 'self' wss: https: blob:; worker-src 'self' blob:; frame-src 'self' https:; frame-ancestors 'none'; form-action 'self'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests;" always;

    # -----------------------------------------------------------------------
    # Funções do servidor (runtime em 127.0.0.1:8788)
    # -----------------------------------------------------------------------
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex" always;
    }

    # Caminho antigo, mantido só para compatibilidade. Pode sair quando não
    # houver mais nenhum cliente (APK antigo, cache de navegador) usando-o.
    location ^~ /.netlify/functions/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # -----------------------------------------------------------------------
    # Supabase auto-hospedado (Kong em 127.0.0.1:8000)
    # -----------------------------------------------------------------------
    location ^~ /auth/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /rest/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /realtime/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /storage/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /functions/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # -----------------------------------------------------------------------
    # Arquivos estáticos
    # -----------------------------------------------------------------------

    # Se o arquivo não existe, devolve 404 — NUNCA o index.html. Sem isso o
    # navegador recebe HTML no lugar de um .js e acusa erro de MIME type.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ~ ^/workbox- {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /build.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Páginas legais e institucionais (arquivos .html vindos de public/,
    # que o build do Vite copia para dentro do dist).
    location ~ ^/(privacidade|termos|moderacao|sobre|recursos|selo-dourado|chave-seguranca)$ {
        try_files /$1.html =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location ^~ /apk/ {
        root /opt/undoing/public;
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # SPA: qualquer outra rota entrega o index.html
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -----------------------------------------------------------------------
    # TLS (gerenciado pelo Certbot)
    # -----------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/udgservidor.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/udgservidor.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # TLS híbrido pós-quântico. Requer OpenSSL 3.5+ (ou 3.2+ com oqs-provider).
    # Se o nginx reclamar de curva desconhecida, comente esta linha — o site
    # continua funcionando com X25519 normal.
    ssl_ecdh_curves X25519MLKEM768:X25519:prime256v1;
}
